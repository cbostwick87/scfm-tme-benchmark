# ============================================================
# scfm-tme-benchmark -- default (full study) configuration
# Config-driven by design: no analysis constant is hard-coded in a script.
# Paths resolve against ${SCFM_DATA_ROOT}; nothing here encodes a host path.
# ============================================================
run:
  name: full
  seeds: [0, 1, 2, 3, 4]          # 5 independent seeds per grid cell
  n_workers: 3                    # 4 vCPU / 15 GiB shared -- see memory note below
  max_worker_rss_gb: 3.5          # 3 workers x 3.5 GiB leaves headroom; OOM is a design error

data:
  root: ${SCFM_DATA_ROOT}
  raw: ${SCFM_DATA_ROOT}/raw
  processed: ${SCFM_DATA_ROOT}/processed
  embeddings: ${SCFM_DATA_ROOT}/embeddings
  models: ${SCFM_DATA_ROOT}/models
  splits: ${SCFM_DATA_ROOT}/splits
  results: results
  figures: figures

# ============================================================
# Foundation-model checkpoints. Identities are pinned: a benchmark that cannot
# say WHICH checkpoint it measured is not reproducible, and this repo ships
# four Geneformer variants' worth of ambiguity if left unstated.
# ============================================================
models:
  hf_cache: ${SCFM_DATA_ROOT}/hf_cache
  torch_cache: ${SCFM_DATA_ROOT}/torch_cache
  geneformer:
    repo: ctheodoris/Geneformer
    # The GENERAL checkpoint. Geneformer-V2-104M_CLcancer is deliberately NOT used:
    # cancer-tuned weights would violate the zero-shot requirement and would
    # confound the pretraining-overlap audit, since its extra training data is
    # cancer single-cell data of exactly the kind this benchmark evaluates.
    checkpoint: Geneformer-V2-104M
    snapshot_commit: 04c2b2e84da7c0f385c3f9ad8f3ec24bab6650e5
    input_size: 4096            # V2 context; V1 was 2048
    pooling: mean_over_real_tokens   # NOT the BERT pooler -- untrained in this ckpt
    precision: fp16             # bf16 is emulated on Turing; never use it here
  scgpt:
    # Released human checkpoint: a raw directory (args.json, best_model.pt,
    # vocab.json), NOT a HuggingFace hub repo.
    checkpoint_dir: ${SCFM_DATA_ROOT}/models/scgpt-human
    use_fast_transformer: false  # flash-attn is not expected to build on Turing
    precision: fp16
    time_box_minutes: 90        # documented fallback if it cannot be made to run

corpus:
  # Selected by pre-specified criteria applied uniformly to all 28 screened TISCH2
  # entries (see results/dataset_screening.csv for the full screen, including
  # every rejection and its reason):
  #   C1  >= 3 donors                  -- a three-way donor split under S2 needs >= 3
  #   C2  >= 3 mappable immune classes -- multi-class immune annotation
  #   C3  >= 500 mappable immune cells -- enough to support the label-budget sweep
  # then, for breadth, at most 2 datasets per cancer type ranked on immune-class
  # count and immune-cell yield.
  #
  # `group` is the LEAVE-DATASET-OUT holdout unit and is the GSE accession, not the
  # dataset name. Entries sharing an accession are one study and therefore one group,
  # however many TISCH2 entries they produce -- otherwise S3 places the same study on
  # both sides of the split and cross-dataset transfer scores inflate silently.
  target_cells_per_dataset: [10000, 30000]
  max_datasets_per_cancer: 2
  datasets:
      - {name: BRCA_GSE161529, cancer: BRCA, group: GSE161529, donors: 53, source: tisch2}
      - {name: BRCA_GSE176078, cancer: BRCA, group: GSE176078, donors: 26, source: tisch2}
      - {name: CHOL_GSE125449_aPD1aPDL1aCTLA4, cancer: CHOL, group: GSE125449, donors: 10, source: tisch2}
      - {name: CRC_GSE108989, cancer: CRC, group: GSE108989, donors: 12, source: tisch2}
      - {name: CRC_GSE146771_10X, cancer: CRC, group: GSE146771, donors: 10, source: tisch2}
      - {name: HNSC_GSE103322, cancer: HNSC, group: GSE103322, donors: 21, source: tisch2}
      - {name: LIHC_GSE140228_10X, cancer: LIHC, group: GSE140228, donors: 5, source: tisch2}
      - {name: LIHC_GSE98638, cancer: LIHC, group: GSE98638, donors: 6, source: tisch2}
      - {name: NSCLC_GSE127465, cancer: NSCLC, group: GSE127465, donors: 7, source: tisch2}
      - {name: NSCLC_GSE131907, cancer: NSCLC, group: GSE131907, donors: 44, source: tisch2}
      - {name: PAAD_GSE111672, cancer: PAAD, group: GSE111672, donors: 3, source: tisch2}
      - {name: PAAD_GSE154778, cancer: PAAD, group: GSE154778, donors: 16, source: tisch2}
      - {name: STAD_GSE134520, cancer: STAD, group: GSE134520, donors: 13, source: tisch2}

census:
  version: "2025-11-08"           # PINNED LTS. Never "latest" -- reproducibility depends on it.
  organism: "Homo sapiens"

qc:
  # Explicit thresholds. No undocumented scanpy defaults.
  min_genes_per_cell: 200
  max_pct_mito: 20.0
  min_cells_per_gene: 3
  mito_prefix: "MT-"

harmonisation:
  gene_reference: "hgnc"          # single reference for all datasets
  taxonomy: configs/taxonomy.yaml
  drop_unmappable_labels: true    # DROP and report -- never silently coerce

splits:
  scheme_ids: [S1_within_dataset, S2_leave_donor_out, S3_leave_dataset_out]
  fractions: {train: 0.60, calibration: 0.20, test: 0.20}
  # The calibration partition is RESERVED for Project B (conformal prediction).
  # Project A must not read it. Enforced by splits.assert_calibration_untouched().
  calibration_is_reserved: true

label_budgets: [5, 10, 25, 50, 100, null]   # null == all available per class

embeddings:
  scgpt:
    enabled: true
    checkpoint: whole-human
    n_hvg: 3000
    batch_size: 64
    out_dim: 512
    precision: fp16               # T4 is Turing: fp16 OK, bf16 NOT supported
  geneformer:
    enabled: true
    checkpoint: Geneformer-V2-104M
    input_size: 4096
    layer: -1                     # final layer
    pooling: mean
    precision: fp16
  hvg_pca:
    enabled: true
    n_hvg_grid: [1000, 2000, 3000]     # tuned by inner CV on TRAIN only
    n_pcs_grid: [30, 50, 100]
    hvg_flavor: seurat_v3
    incremental_pca: true              # never dense full-matrix PCA
  scvi:
    enabled: true
    n_latent: 30
    max_epochs: 200
    early_stopping: true
  harmony:
    enabled: true
    batch_key: [dataset, donor]
  celltypist:
    enabled: true
    model: Immune_All_Low.pkl

classifier:
  # SAME head for every embedding. The experiment isolates the REPRESENTATION.
  kind: logistic_regression
  penalty: l2
  multi_class: multinomial
  solver: lbfgs
  max_iter: 2000
  C_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  inner_cv_folds: 5               # within TRAIN only, never test

metrics:
  primary: macro_f1
  # Class set for the PRIMARY macro-F1: classes present in BOTH train and test for
  # that contrast. Classes absent from training cannot be predicted by any
  # representation, so including them adds an identical constant penalty to every
  # arm and dilutes the contrast. The all-test-classes variant is computed too and
  # reported as a secondary metric; both appear in T2/T3.
  macro_f1_class_set: learnable          # {learnable, all_test_classes}
  report_secondary_class_set: true
  secondary: [accuracy, balanced_accuracy, per_class_f1, per_class_precision, per_class_recall]

statistics:
  primary_contrast: "scfm_minus_hvg_pca"
  aggregate_seeds_before_testing: true    # datasets are the unit of replication
  test: wilcoxon_signed_rank
  multiple_comparison: benjamini_hochberg
  bootstrap:
    n_resamples: 10000
    resample_unit: dataset               # resample datasets, not cells
    ci_level: 0.95
  report_effect_size_always: true
